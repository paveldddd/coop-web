  <!-- PWA (manifest) поки вимкнено — щоб браузер не пропонував "встановити застосунок" -->
  <meta name="theme-color" content="#2a1a0e">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2a1a0e; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #2a1a0e; }
    /* заставка з логотипом, поки гра вантажиться */
    #splash {
      position: fixed; inset: 0; z-index: 10;
      background: #2a1a0e url("TemplateData/splash.jpg") center / cover no-repeat;
      transition: opacity 0.9s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #bar {
      position: absolute; left: 50%; bottom: 7vh; transform: translateX(-50%);
      width: min(420px, 70vw); height: 18px; padding: 4px;
      background: rgba(40, 22, 10, 0.85); border: 3px solid #1a0d05; border-radius: 4px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.35);
    }
    #fill { width: 0%; height: 100%; background: linear-gradient(#ffd45e, #e8a028); border-radius: 2px; transition: width 0.2s; }
    #label {
      position: absolute; left: 0; right: 0; bottom: calc(7vh + 34px); text-align: center;
      font: bold 15px/1.2 "Trebuchet MS", Arial, sans-serif; color: #fff3d6; letter-spacing: 1px;
      text-shadow: 0 2px 0 #3a1e0c, 0 0 8px rgba(0,0,0,0.6);
    }
    #fs {
      position: fixed; right: 12px; bottom: 12px; z-index: 5; width: 36px; height: 36px;
      border: 2px solid #1a0d05; border-radius: 4px; background: rgba(120, 62, 20, 0.85);
      color: #fff3d6; font: bold 18px Arial; cursor: pointer; opacity: 0.75;
    }
    #fs:hover { opacity: 1; }
    /* телефон тримають вертикально — просимо повернути (гра лише горизонтальна) */
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 20; background: #2a1a0e;
      color: #fff3d6; text-align: center; font: bold 18px/1.4 "Trebuchet MS", Arial, sans-serif;
      flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px;
      text-shadow: 0 2px 0 #3a1e0c;
    }
    #rotate .phone {
      width: 54px; height: 92px; border: 5px solid #ffd45e; border-radius: 10px;
      animation: turn 2.2s ease-in-out infinite;
    }
    #rotate small { font-size: 14px; opacity: 0.75; }
    #playLand {
      font: bold 22px "Trebuchet MS", Arial, sans-serif; color: #3a1e0c; padding: 16px 40px;
      background: linear-gradient(#ffd45e, #e8a028); border: 3px solid #1a0d05; border-radius: 6px;
      box-shadow: 0 5px 0 rgba(0,0,0,0.35); letter-spacing: 1px;
    }
    @keyframes turn { 0%, 25% { transform: rotate(0deg); } 55%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="splash">
    <div id="label">Курочки прокидаються…</div>
    <div id="bar"><div id="fill"></div></div>
  </div>
  <div id="rotate">
    <div class="phone"></div>
    <div id="rotTxt">Курник грається горизонтально</div>
    <button id="playLand">▶ ГРАТИ</button>
    <small id="rotHint">або просто поверни телефон</small>
  </div>
  <button id="fs" title="На весь екран">⛶</button>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var splash = document.querySelector("#splash");
    var fill = document.querySelector("#fill");
    var label = document.querySelector("#label");
    // мова: як у грі (вибір у меню), а вперше — за мовою браузера
    var ukLang = /^(uk|ru|be)/i.test(navigator.language || "");
    var lines = ukLang
      ? ["Курочки прокидаються…", "Сиплемо зерно…", "Розставляємо гніздечка…", "Будимо півника…", "Майже готово!"]
      : ["The hens are waking up…", "Scattering grain…", "Fluffing the nests…", "Waking the rooster…", "Almost ready!"];
    if (!ukLang) {
      document.querySelector("#label").textContent = lines[0];
      document.querySelector("#rotTxt").textContent = "The coop plays in landscape";
      document.querySelector("#playLand").textContent = "▶ PLAY";
      document.querySelector("#rotHint").textContent = "or just rotate your phone";
    }

    // На телефоні: перший дотик — на весь екран і замкнути горизонтальну орієнтацію (Android Chrome вміє).
    var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    function goLandscape() {
      if (!coarse) return;
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      var p = (!document.fullscreenElement && req) ? req.call(el) : null;
      var lock = function () {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
      };
      if (p && p.then) p.then(lock).catch(function () {}); else lock();
    }
    document.addEventListener("touchend", goLandscape, { passive: true });
    document.querySelector("#playLand").addEventListener("click", goLandscape);
    // iPhone не вміє повноекранний режим для сайтів — лишаємо тільки підказку повернути
    var el0 = document.documentElement;
    if (!(el0.requestFullscreen || el0.webkitRequestFullscreen)) {
      document.querySelector("#playLand").style.display = "none";
      document.querySelector("#rotTxt").textContent = ukLang ? "Поверни телефон горизонтально" : "Rotate your phone to landscape";
      document.querySelector("#rotHint").textContent = "";
    }

    // Згорнули/розгорнули браузер: на деяких телефонах замість гри білий екран (полотно WebGL не перемальовується),
    // хоча гра жива. Змушуємо браузер перемалювати полотно; якщо WebGL-контекст справді втрачено — перезавантажуємо.
    var lostCtx = false;
    function repaintCanvas() {
      canvas.style.visibility = "hidden"; void canvas.offsetHeight; canvas.style.visibility = "";
      window.dispatchEvent(new Event("resize"));
    }
    canvas.addEventListener("webglcontextlost", function (e) { e.preventDefault(); lostCtx = true; }, false);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) return;
      if (lostCtx) { location.reload(); return; }
      setTimeout(repaintCanvas, 60); setTimeout(repaintCanvas, 500);
    });
    window.addEventListener("pageshow", function (e) { if (e.persisted) location.reload(); }); // повернулись «назад» зі старого кешу сторінки

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/6f718f5d2b348a23e7befff1cdad1855.loader.js";
    var config = {
      dataUrl: buildUrl + "/426fe9189374c4d72b8842642ee46ea1.data",
      frameworkUrl: buildUrl + "/d3e1f201a4656214fad23ebd20102a7d.framework.js",
      codeUrl: buildUrl + "/88574658f0f3aa969e26238ec06153ac.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Курник",
      productVersion: "0.1.0",
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = (100 * progress) + "%";
        label.textContent = lines[Math.min(lines.length - 1, Math.floor(progress * lines.length))];
      }).then(function (unityInstance) {
        fill.style.width = "100%";
        setTimeout(function () { splash.classList.add("hide"); }, 300);
        document.querySelector("#fs").onclick = function () { unityInstance.SetFullscreen(1); };
        canvas.focus();
      }).catch(function (message) {
        label.textContent = "Ой! " + message;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
